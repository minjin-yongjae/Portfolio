<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>이민진 | HR Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet"><style>
:root{--bg:#f9f8f6;--card:#fff;--ink:#111;--mut:#5c5c5c;--ac:#19a7f0;--soft:#e6f5fd;--line:#d8d8d4;--pill:#000;--glow:#b9ddf2;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--card:#1a1f28;--ink:#f2f4f7;--mut:#a3acba;--soft:#15283a;--line:#2b323e;--pill:#2b3140;--glow:#1b4a6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101319;--card:#1a1f28;--ink:#f2f4f7;--mut:#a3acba;--soft:#15283a;--line:#2b323e;--pill:#2b3140;--glow:#1b4a6b;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',-apple-system,'Apple SD Gothic Neo',sans-serif;line-height:1.65;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;text-align:inherit}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px;border-radius:6px}
.en{font-family:Outfit,'Noto Sans KR',sans-serif}
.glow{position:fixed;left:0;right:0;bottom:0;height:55vh;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 100%,var(--glow),transparent 70%);opacity:.3;transition:opacity .5s;z-index:0}
body[data-p=home] .glow{opacity:1}
.bar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 18px) 48px 14px;background:linear-gradient(var(--bg) 60%,transparent)}
.bar a.lg{font-weight:700;font-size:17px}.bar nav{display:flex;gap:6px}
.bar nav a{padding:7px 18px;border-radius:99px;font-size:14.5px;color:var(--mut);transition:.2s}
.bar nav a:hover{color:var(--ink)}.bar nav a.on{background:var(--pill);color:#fff}
main{position:relative;z-index:1}
.pg{display:none;min-height:100vh;padding:110px 48px 60px;max-width:1320px;margin:0 auto}
.pg.on{display:block;animation:in .5s both}@keyframes in{from{opacity:0;transform:translateY(12px)}}
.home{text-align:center;padding-top:150px}
.home .vl{position:fixed;left:50%;top:0;width:1px;height:70px;background:#999;z-index:0}
.home h6{font:300 44px Outfit;margin:0 0 26px;letter-spacing:.02em}
.home h1{font-size:clamp(36px,5.2vw,68px);line-height:1.3;font-weight:300;margin:0}.home h1 b{font-weight:900}
.home p{font-size:18px;margin:40px auto 0;max-width:640px;color:var(--ink)}
.go{display:inline-block;margin-top:26px;background:var(--pill);color:#fff;border-radius:99px;padding:11px 30px;font-size:15px;transition:.2s}.go:hover{background:var(--ac)}
.cbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(1350px,96%);background:var(--card);border-radius:22px 22px 0 0;padding:26px 40px calc(env(safe-area-inset-bottom,0px) + 26px);display:flex;justify-content:space-around;gap:20px;flex-wrap:wrap;font-size:15px;z-index:2}
body:not([data-p=home]) .cbar{display:none}.cbar b{font-weight:700;margin-right:12px}.cbar b:after{content:"|";margin-left:12px;font-weight:400}
.split{display:grid;grid-template-columns:1fr 1.1fr;gap:70px;align-items:center;min-height:calc(100vh - 170px)}
.split h2,.ttl{font:400 clamp(48px,6vw,84px) Outfit;margin:0;line-height:1.1}
.split p{font-size:18px;margin:18px 0 0}.split p b{font-weight:700}
.panel{background:var(--card);border-radius:34px;padding:36px 44px}
.ci{display:grid;grid-template-columns:70px 1fr;gap:6px 20px;width:100%;padding:20px 0;border-bottom:1px solid var(--line);transition:.2s}.ci:last-child{border:0}
.ci:hover{padding-left:12px}.ci:hover .nm{color:var(--ac)}
.ci .no{font:400 26px Outfit}.ci .nm{font-size:20px;font-weight:700}.ci small{display:block;color:var(--mut);font-size:14px;font-weight:300}
.prof{display:grid;grid-template-columns:380px 1fr;gap:56px}
.me{background:var(--card);border-radius:34px;padding:40px;align-self:start}.me img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:center top;border-radius:20px;display:block}
.me h3{font-size:28px;font-weight:300;margin:30px 0 24px;line-height:1.4}.me h3 b{font-weight:900}
.h{font:400 22px Outfit;color:var(--ac);margin:0 0 14px}
.me p{margin:6px 0;font-size:15px}
.intro{color:var(--mut);font-size:15.5px;margin:6px 0 46px;max-width:640px}
.pg4{display:grid;grid-template-columns:1fr 1fr;gap:44px 56px}
.li{display:grid;grid-template-columns:128px 1fr;gap:4px 16px;font-size:15px;padding:5px 0}.li b{font-weight:700;font-family:Outfit,'Noto Sans KR';font-size:14.5px}
.exp{display:grid;grid-template-columns:340px 1fr;gap:30px;margin-top:26px}
.tabs{display:flex;flex-direction:column;gap:8px}.tabs button{padding:16px 20px;border-radius:20px;background:transparent;transition:.2s;border:1px solid transparent}
.tabs button:hover{background:var(--card)}.tabs button[aria-selected=true]{background:var(--card);border-color:var(--line);box-shadow:0 8px 24px rgba(0,0,0,.05)}
.tabs b{display:block;font-size:17px}.tabs small{color:var(--mut)}
.det{background:var(--card);border-radius:34px;padding:36px 44px}.det h3{margin:0;font-size:26px}.det .sub{color:var(--mut);margin:4px 0 6px}
.det .cols{columns:2 320px;column-gap:44px}.det h4{color:var(--ac);font:400 19px Outfit,'Noto Sans KR';margin:20px 0 4px;break-after:avoid}
.det ul{list-style:none;margin:0;padding:0}.det li{padding:6px 0 6px 18px;position:relative;font-size:15px;border-bottom:1px solid var(--line);break-inside:avoid}.det li:before{content:"";position:absolute;left:3px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.ph{text-align:center}.ph .pl{display:inline-block;color:var(--ac);text-decoration:underline;text-underline-offset:5px;font:400 22px Outfit}
.ph h2{font-size:clamp(24px,3vw,34px);font-weight:300;margin:14px 0 0}.ph h2 b{font-weight:900}
hr{border:0;border-top:1px solid #b9b9b5;margin:28px 0 38px}
.ov{display:grid;grid-template-columns:1fr 1.2fr;gap:44px;align-items:center;text-align:left}
.ov.n{grid-template-columns:1fr}.shot{background:var(--soft);border-radius:22px;padding:14px;max-height:480px;display:grid;place-items:center}.shot img{max-width:100%;max-height:450px;border-radius:14px}
.ov h3{font-size:26px;margin:0 0 4px}.ov .meta{font-size:13.5px;color:var(--mut);padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.r{padding:14px 0}.r b{font-size:17px}.r b i{font-style:normal;font-weight:400;font-family:Outfit;margin-left:10px;font-size:14px;color:var(--mut);text-transform:uppercase}.r p{margin:4px 0 0;font-size:15px;color:var(--mut)}
.ov.n .rr{display:grid;grid-template-columns:repeat(3,1fr);gap:0}.ov.n .r{padding:0 28px;border-left:1px solid var(--line)}.ov.n .r:first-child{border:0;padding-left:0}
.res{margin-top:26px;text-align:left}.res .k{font:400 20px Outfit;color:var(--ac)}.res p{font-size:clamp(18px,2vw,23px);font-weight:500;margin:6px 0 0;line-height:1.55}
.bars{display:flex;align-items:end;gap:34px;height:190px;padding:0 40px;margin-top:22px;border-bottom:1px solid var(--line);max-width:460px}.bars div{flex:1;border-radius:12px 12px 0 0;background:#cfd8e0;text-align:center;padding-top:8px;font-weight:700;font-size:14px;animation:gr .9s both}.bars div.n{background:var(--ac);color:#fff}@keyframes gr{from{height:0!important}}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:22px}.st div{background:var(--soft);border-radius:18px;padding:16px 20px}.st small{display:block;color:var(--mut);font-size:13px}.st strong{font:400 32px Outfit}
.sm{font-size:12.5px;color:var(--mut);margin-top:8px!important}
.pn{display:flex;justify-content:space-between;margin-top:34px}.pn a{padding:10px 24px;border-radius:99px;background:var(--card);font-size:14.5px}.pn a:hover{background:var(--pill);color:#fff}
@media(max-width:980px){.pg{padding:96px 20px 40px}.bar{padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 10px}.bar a.lg{display:none}.bar nav{overflow-x:auto}.split,.prof,.pg4,.exp,.ov{grid-template-columns:1fr;gap:28px}.ov.n .rr,.st{grid-template-columns:1fr}.ov.n .r{padding:12px 0;border:0}.cbar{position:static;transform:none;width:100%;margin-top:30px;border-radius:22px}.home{padding-top:110px}.home .vl{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
